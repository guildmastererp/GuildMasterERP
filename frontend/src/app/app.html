<div style="padding: 20px; font-family: sans-serif;">
  <h1>GuildMasterERP - Lista de Personajes</h1>
  <p>Datos reales traídos desde la API de Laravel</p>

  <table border="1" cellpadding="10" cellspacing="0" style="width: 100%; border-collapse: collapse; text-align: left;">
    <thead style="background-color: #f2f2f2;">
      <tr>
        <th>Nombre</th>
        <th>Servidor</th>
        <th>Clase</th>
        <th>Especialización</th>
        <th>iLVL</th>
        <th>Cuenta (BattleTag)</th>
        <th>Rango Gremio</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let pj of personajes">
        <td><strong>{{ pj.name }}</strong></td>
        <td>{{ pj.realm }}</td>
        <td>{{ pj.class }}</td>
        <td>{{ pj.spec }}</td>
        <td>{{ pj.ilvl }}</td>
        <td>{{ pj.user?.battletag }}</td>
        <td>{{ pj.user?.role?.name }}</td>
      </tr>
    </tbody>
  </table>
</div>
