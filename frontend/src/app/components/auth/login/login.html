<div class="login-wrapper">
  <div class="login-card">
    
    <h2 class="title">GuildMasterERP</h2>
    <p class="subtitle">Inicia sesión en la hermandad</p>

    <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">      
      
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          [disabled]="cargando"
          required 
          placeholder="tu@correo.com">
      </div>

      <div class="form-group">
        <label for="pass">Contraseña</label>
        <input 
          type="password" 
          id="pass" 
          name="pass" 
          [(ngModel)]="pass" 
          [disabled]="cargando"
          required 
          placeholder="Tu contraseña">
      </div>

      <div class="actions">
        
        <div class="alert error" *ngIf="errorBackend" style="margin-bottom: 15px; width: 100%; box-sizing: border-box;">
          {{ errorBackend }}
        </div>

        <button 
          type="submit" 
          class="btn-primary" 
          [disabled]="cargando">
          <span *ngIf="!cargando">Entrar</span>
          <span *ngIf="cargando">Conectando...</span>
        </button>
        
        <button 
          type="button" 
          class="btn-secondary" 
          (click)="irAlRegistro()"
          [disabled]="cargando">
          Crear nueva cuenta
        </button>
      </div>

    </form>
  </div>
</div>
